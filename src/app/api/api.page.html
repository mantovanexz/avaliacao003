<ion-header [translucent]="true">
  <ion-toolbar>
    
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>

    <ion-searchbar 
        placeholder="Buscar filmes por título..."
        [debounce]="500" 
        (ionInput)="onSearchChange($event)" 
        (ionClear)="onSearchChange({ detail: { value: '' } })"
        show-clear-button="focus" 
        animated="true"
    ></ion-searchbar>
    
  </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true">
    
    <div class="container">
      
      <h2>Filmes Populares / Resultados da Busca (TMDB)</h2>
      
      <div *ngIf="filmes.length === 0">
        <p>Carregando filmes ou nenhum filme encontrado...</p>
      </div>
        
      <div *ngFor="let filme of filmes" class="card-filme">
        
        <h3>{{ filme.title }}</h3>
        
        <div *ngIf="filme.poster_path" class="poster-container">
          <img 
            [src]="'https://image.tmdb.org/t/p/w300' + filme.poster_path" 
            [alt]="'Poster de ' + filme.title"
            style="width: 100%; max-width: 185px; height: auto;"
          >
        </div>
        
        <p>
          <strong>Lançamento:</strong> {{ filme.release_date | date: 'dd/MM/yyyy' }}
        </p>
        
        <p>
          <strong>Avaliação:</strong> 
          <span [style.color]="filme.vote_average >= 7 ? 'green' : 'orange'">
            {{ filme.vote_average }} / 10
          </span>
        </p>
        
        <details>
          <summary>Sinopse</summary>
          <p>{{ filme.overview }}</p>
        </details>
        
        <hr>
      </div>
      
    </div>
</ion-content>
