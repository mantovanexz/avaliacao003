<ion-content>
  <div class="flex-center">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Login</ion-card-title>
      </ion-card-header>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <ion-card-content>
          <ion-item>
            <ion-label position="floating">Email</ion-label>
            <ion-input type="email" formControlName="email"></ion-input>
          </ion-item>
          <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="validation-error">
            <ion-text color="danger">Email é obrigatório.</ion-text>
          </div>

          <ion-item>
            <ion-label position="floating">Senha</ion-label>
            <ion-input type="password" formControlName="senha"></ion-input>
          </ion-item>
          <div *ngIf="loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched" class="validation-error">
            <ion-text color="danger">Senha é obrigatória.</ion-text>
          </div>

          <ion-button routerLink="/recuperarsenha" color="dark" fill="clear" size="full">
            Esqueceu a senha?
          </ion-button>

          <ion-button 
            type="submit" 
            color="primary" 
            size="full" 
            [disabled]="loginForm.invalid"
          >
            Login
          </ion-button>

          <ion-button routerLink="/cadastro" color="tertiary" size="full">
            Cadastrar
          </ion-button>

        </ion-card-content>
      </form>
    </ion-card>
  </div>
</ion-content>

<style>
  .validation-error {
    padding-left: 15px; 
    font-size: 0.8em;
  }
</style>
