<ion-header>
  <ion-toolbar>
    <ion-title>Recuperar Senha</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2>Esqueceu sua senha?</h2>
  <p>Informe seu e-mail para receber um link de redefinição.</p>

  <ion-item>
    <ion-label position="floating">E-mail</ion-label>
    <ion-input type="email" [(ngModel)]="email"></ion-input>
  </ion-item>

  <ion-button expand="full" 
              class="ion-margin-top"
              (click)="enviarSolicitacao(email)"
              [disabled]="!email">
    Enviar Link de Redefinição
  </ion-button>

  <ion-text color="medium" class="ion-text-center ion-margin-top">
    <p>Lembrou a senha? <a routerLink="/login">Faça Login</a></p>
  </ion-text>
</ion-content>
